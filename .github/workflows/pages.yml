name: Publish website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Point the website at your stem server
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          SERVER_URL: ${{ vars.SERVER_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          url="$SERVER_URL"
          if [ -z "$url" ] && [ -n "$HF_SPACE" ]; then
            # Hugging Face Space address: https://<owner>-<space>.hf.space
            sub=$(echo "$HF_SPACE" | tr '[:upper:]' '[:lower:]' | sed 's#/#-#; s#[^a-z0-9-]#-#g')
            url="https://${sub}.hf.space"
          fi
          echo "Server: ${url:-not set}"
          cat > site/config.js <<EOF
          window.MINUSONE_CONFIG = {
            server: "${url}",
            repo: "${REPO_URL}",
          };
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
